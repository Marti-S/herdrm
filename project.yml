name: HerdrM
options:
  bundleIdPrefix: dev.bybee
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
packages:
  HerdrKit:
    path: Packages/HerdrKit
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.2.0"
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.9.6"
targets:
  HerdrM:
    type: application
    platform: macOS
    sources:
      - Sources/HerdrM
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: HerdrKit
      - package: SwiftTerm
      - package: Sparkle
    info:
      path: Sources/HerdrM/Info.plist
      properties:
        CFBundleName: herdrm
        CFBundleDisplayName: herdrm
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 MOE AI LLC"
        SUFeedURL: https://github.com/missuo/herdrm/releases/latest/download/appcast.xml
        SUPublicEDKey: RHEhllstUuuVrVDCPGrbhg/8LivSzpuZB9X3u3xdV5o=
        SUEnableAutomaticChecks: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.bybee.herdrm
        PRODUCT_NAME: herdrm
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.10"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: YES
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: NCFNX3LJ83
      configs:
        Debug:
          # real identity so UserNotifications & friends work in dev builds
          CODE_SIGN_IDENTITY: "Developer ID Application: MOE AI LLC (NCFNX3LJ83)"
          ONLY_ACTIVE_ARCH: YES
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application: MOE AI LLC (NCFNX3LJ83)"
          ONLY_ACTIVE_ARCH: NO
          ARCHS: "arm64 x86_64"
