name: Apply Sync Optimization Once

on:
  push:
    branches:
      - optimize-sync-pipeline
    paths:
      - .github/workflows/apply-sync-optimization-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-sync-optimization-once
  cancel-in-progress: false

jobs:
  apply-test-and-commit:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize-sync-pipeline
          fetch-depth: 0

      - name: Apply optimization patch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("scripts/apply_sync_optimization_v2.py")
          source = path.read_text(encoding="utf-8")
          source = re.sub(r'\\+"snapshot\\+"', '"snapshot"', source)
          expected = 'data.append(Data(#","snapshot":"#.utf8))'
          if expected not in source:
              raise SystemExit("The corrected snapshot JSON separator was not found.")
          namespace = {"__name__": "__main__", "__file__": str(path)}
          exec(compile(source, str(path), "exec"), namespace)
          PY

      - name: Check patch formatting
        run: git diff --check

      - name: Parse modified Swift sources
        run: |
          set -euo pipefail
          for file in \
            Packages/HerdrKit/Sources/HerdrKit/FleetBridgeWire.swift \
            Packages/HerdrKit/Tests/HerdrKitTests/FleetBridgeWireTests.swift \
            Sources/HerdrM/AppModel.swift \
            Sources/HerdrM/FleetBridgeServer.swift \
            Sources/HerdrM/FleetBridgeServerConnection.swift \
            Sources/HerdrMobile/MobileAppModel.swift \
            Sources/HerdrMobile/MobileBridge.swift \
            Sources/HerdrMobile/MobileSessions.swift \
            Sources/HerdrMobile/MobileTerminalView.swift
          do
            swiftc -frontend -parse "$file"
          done

      - name: Test HerdrKit
        run: swift test --package-path Packages/HerdrKit

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Xcode packages
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if xcodebuild \
              -resolvePackageDependencies \
              -project HerdrM.xcodeproj \
              -clonedSourcePackagesDirPath build-packages \
              -skipPackagePluginValidation; then
              exit 0
            fi
            sleep $((attempt * 10))
          done
          exit 1

      - name: Build macOS app
        run: |
          set -euo pipefail
          xcodebuild \
            -project HerdrM.xcodeproj \
            -scheme HerdrM \
            -configuration Debug \
            -sdk macosx \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build-macos \
            -clonedSourcePackagesDirPath build-packages \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            build

      - name: Build iOS device app
        run: |
          set -euo pipefail
          xcodebuild \
            -project HerdrM.xcodeproj \
            -scheme HerdrMobile \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-ios \
            -clonedSourcePackagesDirPath build-packages \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            build

      - name: Build arm64 iOS Simulator app
        run: |
          set -euo pipefail
          xcodebuild \
            -project HerdrM.xcodeproj \
            -scheme HerdrMobile \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-ios \
            -clonedSourcePackagesDirPath build-packages \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM= \
            build

      - name: Remove one-shot automation
        run: |
          rm -f \
            .github/workflows/apply-sync-optimization-v2.yml \
            scripts/apply_sync_optimization_once.py \
            scripts/apply_sync_optimization_v2.py

      - name: Commit validated optimization
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes remain to commit."
            exit 0
          fi
          git commit -m "Optimize fleet synchronization pipeline"
          git push origin HEAD:optimize-sync-pipeline
