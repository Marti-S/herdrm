name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      SPARKLE_VERSION: "2.9.6"
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import Developer ID certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          security create-keychain -p ci "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KEYCHAIN" > /dev/null
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build and sign
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          xcodegen generate
          xcodebuild -project HerdrM.xcodeproj -scheme HerdrM -configuration Release \
            -derivedDataPath build build -skipPackagePluginValidation \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            OTHER_CODE_SIGN_FLAGS="--timestamp" CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO

      - name: Re-sign Sparkle nested components
        run: |
          IDENTITY="Developer ID Application: MOE AI LLC (NCFNX3LJ83)"
          APP="build/Build/Products/Release/herdrm.app"
          FW="$APP/Contents/Frameworks/Sparkle.framework"
          codesign -f --timestamp -o runtime --preserve-metadata=entitlements \
            -s "$IDENTITY" "$FW/Versions/B/XPCServices/Downloader.xpc"
          codesign -f --timestamp -o runtime -s "$IDENTITY" "$FW/Versions/B/XPCServices/Installer.xpc"
          codesign -f --timestamp -o runtime -s "$IDENTITY" "$FW/Versions/B/Autoupdate"
          codesign -f --timestamp -o runtime -s "$IDENTITY" "$FW/Versions/B/Updater.app"
          codesign -f --timestamp -o runtime -s "$IDENTITY" "$FW"
          codesign -f --timestamp -o runtime -s "$IDENTITY" "$APP"
          codesign --verify --deep --strict "$APP"

      - name: Extract release notes from CHANGELOG
        run: |
          python3 - "$VERSION" <<'PYEOF'
          import html, re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md").read()
          m = re.search(rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\Z)", text, re.S)
          if not m or not m.group(1).strip():
              sys.exit(f"CHANGELOG.md has no section for {version} — add one before tagging")
          notes = m.group(1).strip()
          open("notes.md", "w").write(notes)
          out, in_ul = [], False
          for line in notes.splitlines():
              s = line.rstrip()
              if s.startswith("- "):
                  if not in_ul:
                      out.append("<ul>"); in_ul = True
                  out.append("<li>" + html.escape(s[2:]) + "</li>")
              elif s.startswith("  ") and in_ul and out:
                  out[-1] = out[-1][:-5] + " " + html.escape(s.strip()) + "</li>"
              else:
                  if in_ul:
                      out.append("</ul>"); in_ul = False
                  if s.startswith("### "):
                      out.append("<h3>" + html.escape(s[4:]) + "</h3>")
                  elif s:
                      out.append("<p>" + html.escape(s) + "</p>")
          if in_ul:
              out.append("</ul>")
          open("notes.html", "w").write("\n".join(out))
          PYEOF
          echo "--- notes.md ---"; cat notes.md

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          APP="build/Build/Products/Release/herdrm.app"
          ditto -c -k --keepParent "$APP" notarize.zip
          xcrun notarytool submit notarize.zip \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$APP"
          rm notarize.zip
          ditto -c -k --keepParent "$APP" "herdrm-$VERSION.zip"

      - name: Sign update and generate appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          curl -sL -o sparkle.tar.xz "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          mkdir -p sparkle && tar -xf sparkle.tar.xz -C sparkle
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/ed_key"
          SIG_ATTRS=$(./sparkle/bin/sign_update -f "$RUNNER_TEMP/ed_key" "herdrm-$VERSION.zip")
          rm "$RUNNER_TEMP/ed_key"
          PUBDATE=$(LC_ALL=en_US.UTF-8 date -u "+%a, %d %b %Y %H:%M:%S +0000")
          cat > appcast.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>herdrm</title>
              <item>
                <title>herdrm $VERSION</title>
                <pubDate>$PUBDATE</pubDate>
                <sparkle:version>$GITHUB_RUN_NUMBER</sparkle:version>
                <sparkle:shortVersionString>$VERSION</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <link>https://github.com/${{ github.repository }}/releases/tag/v$VERSION</link>
                <description><![CDATA[
          $(cat notes.html)
                ]]></description>
                <enclosure
                  url="https://github.com/${{ github.repository }}/releases/download/v$VERSION/herdrm-$VERSION.zip"
                  $SIG_ATTRS
                  type="application/octet-stream"/>
              </item>
            </channel>
          </rss>
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "herdrm-$VERSION.zip" appcast.xml \
            --title "herdrm $VERSION" --notes-file notes.md

      - name: Bump Homebrew cask
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          [ -n "$TAP_TOKEN" ] || { echo "TAP_GITHUB_TOKEN not set, skipping"; exit 0; }
          SHA=$(shasum -a 256 "herdrm-$VERSION.zip" | cut -d' ' -f1)
          git clone --depth 1 "https://x-access-token:$TAP_TOKEN@github.com/OwO-Network/homebrew-brew" tap
          cd tap
          sed -i '' -E "s|^  version \".*\"|  version \"$VERSION\"|" Casks/herdrm.rb
          sed -i '' -E "s|^  sha256 \".*\"|  sha256 \"$SHA\"|" Casks/herdrm.rb
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(herdrm): bump to $VERSION"
          git push
